<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Operação LUA</title><link rel="stylesheet" href="/style.css"><body><header><span>SIMULAÇÃO INVESTIGATIVA</span><h1>Operação LUA</h1><p>Ambiente de exercício • dados fictícios</p></header><main><div id="message" role="status"></div><section id="login"><h2>Acesso à turma</h2><form id="loginForm"><label>Usuário<input name="name" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="registration"><h2>Cadastro do aluno</h2><p>Crie a equipe ou entre usando o nome exato e o código compartilhado pelos integrantes.</p><form id="registerForm"><label>Nome do aluno / usuário<input name="name" required></label><label>Senha pessoal<input name="password" type="password" minlength="10" required></label><label>Nome da equipe<input name="team" required></label><label>Código de entrada da equipe<input name="team_code" type="password" minlength="10" required></label><button>Cadastrar aluno</button></form></section><div id="workspace" hidden></div></main><script src="/app.js"></script></body></html>
